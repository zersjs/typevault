[package]
name = "typevault"
version = "1.0.0"
description = "Türkçe font kütüphanesi ve yöneticisi"
license = "MIT"
repository = "https://github.com/zersjs/typevault"
edition = "2021"
rust-version = "1.94"

[lib]
name = "typevault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "fs", "macros", "io-util"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "gzip"] }
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
sha2 = "0.10"
hex = "0.4"
ttf-parser = "0.25"
zip = { version = "2", default-features = false, features = ["deflate"] }
thiserror = "2"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
csv = "1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
core-foundation = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
